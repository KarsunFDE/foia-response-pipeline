server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA client-side routing: serve index.html for unknown paths so a refresh
  # or deep-link on an Angular route (e.g. /foiaRequests/:id/triage) works
  # instead of returning nginx 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never serve a stale index.html — the hashed JS/CSS bundle names change on
  # every build, so the browser must always revalidate the entry document to
  # pick up a new build. (Hashed assets below can cache forever.)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  # Fingerprinted build assets are immutable — safe to cache aggressively.
  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
